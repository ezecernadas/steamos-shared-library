<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="steamshare logo">
  <!-- One game controller split between two systems: a window on the left half,
       a terminal prompt on the right. Steam-like palette; no third-party logos. -->
  <rect width="256" height="256" rx="56" fill="#1b2838"/>
  <defs>
    <clipPath id="controller">
      <path d="M74 78 h108 c26 0 40 18 46 48 l10 48 c5 24 -14 40 -34 28 l-30 -26 h-92 l-30 26 c-20 12 -39 -4 -34 -28 l10 -48 c6 -30 20 -48 46 -48 z"/>
    </clipPath>
  </defs>
  <!-- Raised so the controller sits centered on the background. -->
  <g transform="translate(0 -14)">
  <g clip-path="url(#controller)">
    <rect width="128" height="256" fill="#66c0f4"/>
    <rect x="128" width="128" height="256" fill="#c7d5e0"/>
  </g>
  <g fill="#1b2838">
    <rect x="62" y="104" width="17" height="17" rx="2"/>
    <rect x="83" y="104" width="17" height="17" rx="2"/>
    <rect x="62" y="125" width="17" height="17" rx="2"/>
    <rect x="83" y="125" width="17" height="17" rx="2"/>
  </g>
  <g fill="none" stroke="#1b2838" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 106 l16 16 l-16 16"/>
    <path d="M174 140 h20"/>
  </g>
  </g>
</svg>
