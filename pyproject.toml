[project]
name = "steamshare"
version = "0.2.0"
description = "Share one NTFS Steam library between Windows and Linux on a dual-boot PC"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Runtime must stay dependency-free: SteamOS has a read-only root (CONTRIBUTING.md, rule 1).
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamshare"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# The release build tool is a script, not part of the package.
pythonpath = ["release"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, N: naming, SIM: simpler code.
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
